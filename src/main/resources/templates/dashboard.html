<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background:
                radial-gradient(rgba(5, 12, 24, 0.58), rgba(5, 12, 24, 0.58)),
                url('/images/wallpaper.jpg') center center / cover fixed no-repeat;
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .navbar-custom {
            background-color: rgba(0, 0, 0, 0.7);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar-custom a {
            color: #ffffff !important;
        }

        .navbar-custom button.nav-link {
            color: #ffffff;
            border: 0;
            background: transparent;
        }

        .navbar-custom .navbar-brand {
            font-weight: bold;
        }

        .dashboard-container {
            max-width: 1000px;
            margin-top: 50px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h2, h3 {
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #000000;
            border: none;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #80bdff;
            color: #000;
        }

        .btn-success {
            background-color: #000000;
            border: none;
        }

        .btn-success:hover {
            background-color: #000000;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .account-details {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .error {
            color: #ff4c4c;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .footer {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 0;
            font-size: 14px;
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .footer a {
            color: #80bdff;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            color: #ffecb3;
            text-decoration: underline;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand" href="/dashboard">LedgerBank</a>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/transactions">Transactions</a></li>
        <li class="nav-item"><a class="nav-link" href="/credentials">Change Password</a></li>
        <li class="nav-item">
            <form method="post" th:action="@{/logout}" class="form-inline">
                <button type="submit" class="nav-link">Logout</button>
            </form>
        </li>
    </ul>
</nav>

<div class="container dashboard-container">
    <div class="text-center">
        <h2 th:text="'Welcome, ' + ${account.username}"></h2>
        <h3 th:text="'Total Balance: $' + ${account.balance}"></h3>
    </div>

    <!-- Account Details Section -->
    <div class="account-details">
        <h4>Account Details</h4>
        <p><strong>Checking:</strong> $<span th:text="${checkingBalance}"></span></p>
        <p><strong>Savings:</strong> $<span th:text="${savingsBalance}"></span></p>
    </div>

    <div class="row justify-content-center">
        <!-- Deposit Section -->
        <div class="col-md-3">
            <button class="btn btn-block btn-primary" type="button" data-toggle="collapse" data-target="#depositForm" aria-expanded="false" aria-controls="depositForm">
                Deposit
            </button>
            <div class="collapse mt-3" id="depositForm">
                <form method="post" th:action="@{/deposit}" class="form-container">
                    <div class="form-group">
                        <label>Account</label>
                        <select class="form-control" name="accountType">
                            <option value="CHECKING">Checking</option>
                            <option value="SAVINGS">Savings</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" step="0.01" min="0.01" class="form-control" name="amount" required />
                    </div>
                    <button type="submit" class="btn btn-block btn-success">Submit</button>
                </form>
            </div>
        </div>

        <!-- Withdraw Section -->
        <div class="col-md-3">
            <button class="btn btn-block btn-primary" type="button" data-toggle="collapse" data-target="#withdrawForm" aria-expanded="false" aria-controls="withdrawForm">
                Withdraw
            </button>
            <div class="collapse mt-3" id="withdrawForm">
                <form method="post" th:action="@{/withdraw}" class="form-container">
                    <div class="form-group">
                        <label>Account</label>
                        <select class="form-control" name="accountType">
                            <option value="CHECKING">Checking</option>
                            <option value="SAVINGS">Savings</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" step="0.01" min="0.01" class="form-control" name="amount" required />
                    </div>
                    <button type="submit" class="btn btn-block btn-success">Submit</button>
                </form>
            </div>
        </div>

        <!-- Transfer Section -->
        <div class="col-md-6" id="recipientTransferPanel">
            <button class="btn btn-block btn-primary" type="button" data-toggle="collapse" data-target="#transferForm" aria-expanded="false" aria-controls="transferForm">
                Recipient Transfer
            </button>
            <div class="collapse mt-3" id="transferForm">
                <form method="post" th:action="@{/transfer}" class="form-container">
                    <div class="form-group">
                        <label>From Account</label>
                        <select class="form-control" name="fromType">
                            <option value="CHECKING">Checking</option>
                            <option value="SAVINGS">Savings</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>To Account</label>
                        <select class="form-control" name="toType">
                            <option value="CHECKING">Checking</option>
                            <option value="SAVINGS">Savings</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Recipient's Username</label>
                        <input type="text" class="form-control" name="toUsername" required />
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" step="0.01" min="0.01" class="form-control" name="amount" required />
                    </div>
                    <button type="submit" class="btn btn-block btn-success">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mt-3" id="internalTransferRow">
        <div class="col-md-3" id="internalTransferPanel">
            <button class="btn btn-block btn-primary" type="button" data-toggle="collapse" data-target="#internalTransferForm">
                Transfer
            </button>
            <div class="collapse mt-3" id="internalTransferForm">
                <form method="post" th:action="@{/transfer-between}" class="form-container">
                    <div class="form-group">
                        <label>From</label>
                        <select class="form-control" name="fromType">
                            <option value="CHECKING">Checking</option>
                            <option value="SAVINGS">Savings</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>To</label>
                        <select class="form-control" name="toType">
                            <option value="SAVINGS">Savings</option>
                            <option value="CHECKING">Checking</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" step="0.01" min="0.01" class="form-control" name="amount" required />
                    </div>
                    <button type="submit" class="btn btn-block btn-success">Transfer</button>
                </form>
            </div>
        </div>
    </div>

    <p th:if="${error != null}" th:text="${error}" class="error text-center mt-3"></p>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    const transferRow = document.querySelector('.row.justify-content-center');
    const recipientPanel = document.getElementById('recipientTransferPanel');
    const internalRow = document.getElementById('internalTransferRow');
    const internalPanel = document.getElementById('internalTransferPanel');

    transferRow.insertBefore(internalPanel, recipientPanel);
    internalRow.appendChild(recipientPanel);
</script>
</body>
</html>
