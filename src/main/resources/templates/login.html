<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/ledgerbank.css}">
</head>
<body class="auth-page">
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand" href="/login">LedgerBank</a>
    <a class="nav-link contact-link" href="" target="_blank" rel="noopener noreferrer">Contact</a>
</nav>

<main class="login-stage">
    <section class="login-card" aria-labelledby="login-title">
        <div class="eyebrow">Welcome back</div>
        <h1 id="login-title">Sign in to LedgerBank</h1>
        <p class="login-description">Access your accounts securely.</p>
        <form method="post" th:action="@{/login}">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" class="form-control" name="username" autocomplete="username" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control" name="password" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-block">Login</button>
        </form>
        <p class="auth-note">New to LedgerBank? <a href="/register">Create an account</a></p>

        <div th:if="${param.error}" class="alert alert-danger mt-3 text-center">
            Invalid username or password.
        </div>
    </section>
</main>

<footer class="app-footer">
    <p><a href="#">&copy; 2026 LedgerBank, Inc. | </a><a href="#">About</a> | <a href="#">Terms of Service</a> | <a href="#" target="_blank" rel="noopener noreferrer">Privacy Policy</a> | <a href="#">Security</a> | <a href="#">Disclosure</a></p>
</footer>
</body>
</html>
