<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background:
                radial-gradient(rgba(5, 12, 24, 0.58), rgba(5, 12, 24, 0.58)),
                url('/images/wallpaper.jpg') center center / cover fixed no-repeat;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar-custom {
            background-color: rgba(0, 0, 0, 0.7);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar-custom a {
            color: #ffffff !important;
        }

        .navbar-custom .navbar-brand {
            font-weight: bold;
        }

        .navbar-custom .social-icons a {
            color: #ffffff;
            margin-left: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
        }

        .navbar-custom .social-icons a:hover,
        .navbar-custom .social-icons a:focus {
            color: #ffffff;
            text-decoration: none;
        }

        .login-layout {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 40px;
            width: min(1100px, 90vw);
            margin: 120px auto 100px;
        }

        .container {
            flex: 0 0 420px;
            max-width: 420px;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
            position: relative;
            text-align: center;
        }

        .container h2 {
            color: #ffffff;
            margin-bottom: 20px;
        }

        .form-group label {
            color: #dddddd;
            text-align: left;
            display: block;
        }

        .form-group input {
            border: 1px solid #f8f9fa;
            background-color: #333;
            color: #ffffff;
            height: 46px;
            border-radius: 8px;
        }

        .form-control:focus {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
            border-color: #80bdff;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .btn {
            background-color: #ffffff;
            border: none;
            color: black;
            transition: background-color 0.3s ease;
            width: 100%;
            height: 46px;
            border-radius: 8px;
        }

        .btn:hover {
            background-color: #ffffff;
        }

        .custom-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

        .custom-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .footer {
            background: rgba(0, 0, 0, 0.68);
            color: white;
            padding: 15px 0;
            font-size: 14px;
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .login-layout {
                flex-direction: column;
                gap: 20px;
                margin-top: 100px;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand" href="#">LedgerBank</a>
    <div class="ml-auto social-icons">
        <a href="">Contact</a>
    </div>
</nav>

<div class="login-layout">

    <div class="container">
        <h2 class="text-center" aria-label="Login">
            <i class="fas fa-university" aria-hidden="true" title="Login"></i>
            <span>Login</span>
        </h2>
        <form method="post" th:action="@{/login}">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" class="form-control" name="username" autocomplete="username" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control" name="password" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-block">Login</button>
        </form>
        <p class="text-center mt-3"><a href="/register" class="custom-link">Register a New Account</a></p>

        <div th:if="${param.error}" class="alert alert-danger mt-3 text-center">
            Invalid username or password.
        </div>
    </div>
</div>

<footer class="footer">
    <p><a href="#" class="custom-link">&copy; 2026 LedgerBank, Inc. | </a><a href="#" class="custom-link">About</a> | <a href="#" class="custom-link">Terms of Service</a> | <a href="#" class="custom-link" target="_blank">Privacy Policy</a> | <a href="#" class="custom-link">Security</a> | <a href="#" class="custom-link">Disclosure</a></p>
</footer>
</body>
</html>
