<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>LedgerBank | Change password</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/ledgerbank.css}">
</head>
<body class="settings-page">
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand" href="/dashboard">LedgerBank</a>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/transactions">Transactions</a></li>
        <li class="nav-item"><a class="nav-link" href="" target="_blank" rel="noopener noreferrer">Contact</a></li>
    </ul>
</nav>

<main class="settings-main auth-card">
    <div class="eyebrow">Account security</div>
    <h2>Change password</h2>
    <form method="post" th:action="@{/credentials}">
        <div class="form-group">
            <label for="current-password">Current password</label>
            <input id="current-password" type="password" class="form-control" name="currentPassword" autocomplete="current-password" required />
        </div>
        <div class="form-group">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" class="form-control" name="password" minlength="8" autocomplete="new-password" required />
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" class="form-control" name="confirmPassword" minlength="8" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-block">Change Password</button>
    </form>
    <p class="auth-note"><a href="/dashboard">Return to dashboard</a></p>
    <div th:if="${error}" class="alert alert-danger mt-3" role="alert" th:text="${error}"></div>
</main>
<footer class="app-footer">
    <p><a href="#">&copy; 2026 LedgerBank, Inc. | </a><a href="#">About</a> | <a href="#">Terms of Service</a> | <a href="#" target="_blank" rel="noopener noreferrer">Privacy Policy</a> | <a href="#">Security</a> | <a href="#">Disclosure</a></p>
</footer>
</body>
</html>
