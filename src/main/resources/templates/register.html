<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>LedgerBank | Create account</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/ledgerbank.css}">
</head>
<body class="auth-page">
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand" href="/login">LedgerBank</a>
    <a class="nav-link contact-link" href="" target="_blank" rel="noopener noreferrer">Contact</a>
</nav>

<main class="auth-layout">
    <section class="auth-card" aria-labelledby="register-title">
        <div class="eyebrow">Get started</div>
        <h2 id="register-title">Create your account</h2>
        <form method="post" th:action="@{/register}">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" class="form-control" name="username" autocomplete="username" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control" name="password" minlength="8" autocomplete="new-password" required />
            </div>
            <button type="submit" class="btn btn-block">Create account</button>
        </form>
        <p class="auth-note">Already have an account? <a href="/login">Sign in</a></p>
        <div th:if="${error}" class="alert alert-danger mt-3" role="alert" th:text="${error}"></div>
    </section>
</main>
<footer class="app-footer">
    <p><a href="#">&copy; 2026 LedgerBank, Inc. | </a><a href="#">About</a> | <a href="#">Terms of Service</a> | <a href="#" target="_blank" rel="noopener noreferrer">Privacy Policy</a> | <a href="#">Security</a> | <a href="#">Disclosure</a></p>
</footer>

</body>
</html>
