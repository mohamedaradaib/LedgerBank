spring.application.name=bankapp
server.port=8080

# Default database configuration: embedded H2 database for local development
spring.datasource.url=${DB_URL:jdbc:h2:mem:bankdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 console for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
